<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Subs List</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../../icons/icon-32.png" alt="" width="20" height="20" />
      <h1>Subs List</h1>
    </header>

    <label class="toggle">
      <input type="checkbox" id="listLayout" />
      <span>Show subscriptions as a vertical list</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="hideShorts" />
      <span>Hide Shorts in subscriptions</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="hideWatched" />
      <span>Hide videos I checked off as watched</span>
    </label>

    <p class="hint">Applies only to youtube.com/feed/subscriptions.</p>

    <script src="../settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
